<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>paperfind</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22l5-12 4 8 2-4 3 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-name">paperfind</span>
      <span class="tagline">today's arXiv, read for you by an AI agent</span>
    </div>
    <nav class="views" id="views" hidden>
      <button data-action="view" data-view="feed" class="active">Feed</button>
      <button data-action="view" data-view="log">Agent log<span class="live-dot" id="live-dot" hidden></span></button>
    </nav>
    <div class="topbar-right">
      <span id="model" class="pill model-pill" hidden></span>
      <button id="cost" class="pill" data-action="view" data-view="log" title="Model API spend since the app started. Click for the agent log.">$0.000</button>
      <button id="reset-btn" class="link-btn" hidden>Start over</button>
    </div>
  </header>
  <main id="app"><div class="loading">Loading…</div></main>
  <main id="log-view" hidden></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
